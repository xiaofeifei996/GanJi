name: Build GanJi
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Generate AppIcon assets from the approved original image
        run: |
          set -euo pipefail
          ICON_DIR="GanJi/Assets.xcassets/AppIcon.appiconset"
          test -f Design/AppIcon-Approved.jpg
          mkdir -p "$ICON_DIR"
          # Normalize the source to a true 1024x1024 PNG before generating variants.
          sips -s format png -z 1024 1024 Design/AppIcon-Approved.jpg --out /tmp/ganji-icon-1024.png >/dev/null
          WIDTH="$(sips -g pixelWidth /tmp/ganji-icon-1024.png | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight /tmp/ganji-icon-1024.png | awk '/pixelHeight/ {print $2}')"
          if [[ "$WIDTH" != "1024" || "$HEIGHT" != "1024" ]]; then
            echo "ERROR: generated source icon is ${WIDTH}x${HEIGHT}, expected 1024x1024"
            exit 1
          fi
          sips -z 40 40 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-40.png" >/dev/null
          sips -z 60 60 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-60.png" >/dev/null
          sips -z 58 58 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-58.png" >/dev/null
          sips -z 87 87 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-87.png" >/dev/null
          sips -z 80 80 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-80.png" >/dev/null
          sips -z 120 120 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-120_2.png" >/dev/null
          sips -z 120 120 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-120.png" >/dev/null
          sips -z 180 180 /tmp/ganji-icon-1024.png --out "$ICON_DIR/icon-180.png" >/dev/null
          cp /tmp/ganji-icon-1024.png "$ICON_DIR/icon-1024.png"

      - name: Verify schedule and market order
        run: |
          swiftc Shared/LunarCalendar.swift Shared/MarketData.swift Tests/ScheduleTests.swift -o /tmp/ganji-tests
          /tmp/ganji-tests

      - name: Generate project
        run: xcodegen generate

      - name: Build (capture full diagnostics)
        shell: bash
        run: |
          set +e
          xcodebuild -project GanJi.xcodeproj -scheme GanJi \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO > build.log 2>&1
          status=$?
          echo "===== Swift / compiler errors ====="
          grep -n -B 5 -A 10 -E 'error:|fatal error:|BUILD FAILED' build.log || true
          echo "===== Build log tail ====="
          tail -n 50 build.log
          exit "$status"

      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/GanJi.app"
          ls -la "$APP"
          ls -la "$APP/PlugIns" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/GanJiWidget.appex/Info.plist"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GanJi-unsigned.ipa Payload
          shasum -a 256 GanJi-unsigned.ipa
          du -h GanJi-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GanJi-ipa
          path: GanJi-unsigned.ipa
